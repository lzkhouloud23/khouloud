name: Docker CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/docker-ci.yml'
            client:
              - 'client/**'
              - '.github/workflows/docker-ci.yml'

  build_scan_push:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_READY: ${{ secrets.DOCKERHUB_USER != '' && secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: ${{ secrets.DOCKERHUB_USER || 'local' }}/mern-${{ matrix.service }}
      TRIVY_BLOCK_ON_HIGH_CRITICAL: ${{ vars.TRIVY_BLOCK_ON_HIGH_CRITICAL || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          if [ "${{ matrix.service }}" = "client" ]; then
            docker build --build-arg REACT_APP_API_URL=http://localhost:9000 -t "$IMAGE:$GITHUB_SHA" client
          else
            docker build -t "$IMAGE:$GITHUB_SHA" server
          fi
      - name: Scan image and create full report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          output: trivy_${{ matrix.service }}.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy_${{ matrix.service }}.txt
          if-no-files-found: warn
      - name: Enforce optional HIGH/CRITICAL gate
        if: env.TRIVY_BLOCK_ON_HIGH_CRITICAL == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_READY == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: env.DOCKERHUB_READY == 'true'
        run: docker push "$IMAGE:$GITHUB_SHA"
